# Dependabot is the only update bot (Renovate was configured but never
# ran, and was removed in FHS-692). It covers:
#   1. GitHub Actions versions in .github/workflows/ (grouped weekly PRs)
#   2. Auto-triggered security updates: enabled in repo settings, not here
#
# Updates target `staging` per ADR 0006.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
